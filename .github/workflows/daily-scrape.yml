name: 海关新闻每日抓取

on:
  schedule:
    # 北京时间每天早上 9:00 (UTC 1:00)
    - cron: "0 1 * * *"
  workflow_dispatch: # 允许手动触发

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装系统依赖（Playwright Chromium 所需）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libnspr4 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 2>/dev/null || true

      - name: 安装 Node 依赖
        run: npm install

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 验证脚本版本
        run: |
          echo "=== customs-scraper.js MD5 ==="
          md5sum customs-scraper.js
          echo "=== waitForSelector 相关行 ==="
          grep -n "waitForSelector\|timeout.*20000\|ul.news_list" customs-scraper.js || echo "(none found)"

      - name: 运行抓取脚本
        run: |
          set -euo pipefail
          echo ">>> 脚本开始 $(date)"
          node customs-scraper.js 2>&1
          EXIT_CODE=$?
          echo "<<< 脚本结束 exit_code=$EXIT_CODE"
          exit $EXIT_CODE
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          BITABLE_APP_TOKEN: ${{ secrets.BITABLE_APP_TOKEN }}
          BITABLE_TABLE_ID: ${{ secrets.BITABLE_TABLE_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          CUSTOMS_NEWS_URL: ${{ secrets.CUSTOMS_NEWS_URL }}

      - name: 上传调试截图（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            debug-*.png
            *.png
          retention-days: 7
